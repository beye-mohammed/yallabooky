<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>

<p>Redirecting...</p>

<script>

async function startRedirect() {

    const params = new URLSearchParams(window.location.search);
    const q = params.get("q");

    if (!q) {
        document.body.innerHTML = "Missing parameter q";
        return;
    }

    try {

        const response = await fetch("data.json");
        const data = await response.json();

        const item = data.find(x => x.link === q);

        if (item) {
            window.location.replace(item.tolink);
        } else {
            document.body.innerHTML = "Link not found";
        }

    } catch (e) {
        document.body.innerHTML = "Error loading data";
    }

}

startRedirect();

</script>

</body>
</html>
